{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}SaaS MU.TRA.CHU{% endblock %}</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/saas.css' %}">
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="logo">MU.TRA.CHU</div>

    <a href="{% url 'home' %}"><i class="bi bi-house"></i> Dashboard</a>
    <a href="{% url 'liste_membres' %}"><i class="bi bi-people"></i> Membres</a>
    <a href="{% url 'ajouter_membre' %}"><i class="bi bi-plus-circle"></i> Ajouter</a>

    <hr>

    <a href="/accounts/logout/"><i class="bi bi-box-arrow-right"></i> Logout</a>
</aside>

<!-- MAIN -->
<main class="main">

    <!-- TOP BAR -->
    <div class="topbar">
        <h4>{% block page_title %}{% endblock %}</h4>

        <div class="user-box">
            👤 {{ request.user.username }}
        </div>
    </div>

    <div class="content">

        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}

    </div>
</main>

</div>

</body>
</html>
