{% extends "base.html" %}

{% block page_title %}Supprimer membre{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="delete-card text-center">

            <!-- ICON -->
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-danger display-4"></i>
            </div>

            <!-- TITLE -->
            <h4 class="fw-bold mb-2">Supprimer ce membre ?</h4>

            <!-- MESSAGE -->
            <p class="text-muted">
                Vous êtes sur le point de supprimer <br>
                <strong>{{ membre.nom }} {{ membre.prenom }}</strong>
            </p>

            <p class="text-danger fw-semibold">
                ⚠️ Cette action est irréversible
            </p>

            <!-- ACTIONS -->
            <div class="d-flex justify-content-center gap-3 mt-4">

                <a href="{% url 'liste_membres' %}" class="btn btn-secondary px-4">
                    Annuler
                </a>

                <form method="POST" action="{% url 'supprimer_membre' membre.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        Oui, supprimer
                    </button>
                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
