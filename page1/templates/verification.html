<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vérification membre</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.card-verif {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    text-align: center;
    width: 350px;
}
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
}
.badge-valid {
    background: #22c55e;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
}
</style>

</head>

<body>

<div class="card-verif">

    <h5 class="mb-3">✔ Carte valide</h5>

    {% if membre.photo %}
        <img src="{{ membre.photo.url }}" class="avatar">
    {% endif %}

    <h5 class="fw-bold">{{ membre.nom }} {{ membre.prenom }}</h5>

    <p class="text-muted">{{ membre.emploi }}</p>

    <p><strong>Matricule :</strong> {{ membre.matricule }}</p>

    <span class="badge-valid">Authentifié</span>

</div>

</body>
</html>
