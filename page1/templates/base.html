{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}MU.TRA.CHU{% endblock %}</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="{% static 'page1/css/style.css' %}">
</head>

<body>

<div class="app d-flex">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🪪 MUTRA.CHU.YO
        </div>

        <nav>

            <a href="{% url 'accueil' %}" class="nav-link">
                <i class="bi bi-speedometer2"></i> TABLEAU DE BORD
            </a>

            <a href="{% url 'liste_membres' %}" class="nav-link">
                <i class="bi bi-people"></i> Membres
            </a>

            <a href="{% url 'etape1' %}" class="nav-link">
                <i class="bi bi-person-plus"></i> Ajouter
            </a>

        </nav>

    </aside>

    <!-- MAIN -->
    <div class="main flex-grow-1">

        <!-- TOPBAR (séparée) -->
        <header class="topbar d-flex justify-content-between align-items-center">

            <h5 class="m-0">
                {% block page_title %}Dashboard{% endblock %}
            </h5>

            <div>
                <a href="{% url 'etape1' %}" class="btn btn-primary">
                    + Nouveau membre
                </a>
            </div>

        </header>

        <!-- CONTENT -->
        <div class="content">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}

        </div>

    </div>

</div>

</body>
</html>
