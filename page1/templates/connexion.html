<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion | Espace Sécurisé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {font-family: 'Poppins', sans-serif;}

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: linear-gradient(120deg, #253E90 55%, #f7f8fa 45%);
      overflow: hidden;
    }

    .left-panel {
      width: 55%;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 50px;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1522205408450-add114ad53fe?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      position: relative;
    }

    .left-panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(37, 62, 144, 0.75);
      backdrop-filter: blur(2px);
    }

    .left-panel h1, .left-panel p {
      position: relative;
      z-index: 1;
    }

    .left-panel h1 {
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .left-panel p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 400px;
    }

    .login-container {
      width: 45%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 40px;
      box-shadow: -4px 0 30px rgba(0,0,0,0.1);
      border-top-left-radius: 40px;
      border-bottom-left-radius: 40px;
    }

    .login-box {
      width: 100%;
      max-width: 350px;
    }

    .login-box h2 {
      color: #253E90;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 12px;
      padding: 10px 12px;
    }

    .btn-login {
      width: 100%;
      background: #253E90;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: #1b2f70;
      transform: translateY(-2px);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      position: relative;
      z-index: 1;
      margin-bottom: 20px;
    }

    .small-text {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 15px;
    }

    .small-text a {
      color: #253E90;
      text-decoration: none;
    }

    .small-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      body {flex-direction: column;}
      .left-panel, .login-container {width: 100%; height: 50vh;}
      .login-container {border-radius: 0; box-shadow: none;}
    }
  </style>
</head>

<body>
  <!-- Panneau gauche -->
  <div class="left-panel">
    <div class="brand">💻 TechPortal</div>
    <h1>Bienvenue dans votre espace sécurisé</h1>
    <p>Connectez-vous pour accéder à vos outils, données et fonctionnalités professionnelles.</p>
  </div>

  <!-- Zone de connexion -->
  <div class="login-container">
    <div class="login-box">
      <h2>Connexion</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_username" class="form-label fw-semibold">Nom d’utilisateur</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label fw-semibold">Mot de passe</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-login mt-2">
          <i class="bi bi-box-arrow-in-right me-2"></i> Se connecter
        </button>
      </form>
